name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo kit files present
        run: |
          for f in README.md CLAUDE.md AGENTS.md WORKLOG.md .claude-session.json COLLABORATORS.md docs/CONTRACTS.md docs/ARCHITECTURE.md .env.example SECURITY.md LICENSE .nvmrc; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          python3 -m json.tool .claude-session.json > /dev/null
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - if: hashFiles('package-lock.json') != ''
        run: npm run build
      - if: hashFiles('package-lock.json') != ''
        run: npm run lint
      - if: hashFiles('package-lock.json') != ''
        run: npm test

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run android:sync
        env:
          PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: gokulmobilize-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
