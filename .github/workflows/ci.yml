name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo kit files present
        run: |
          for f in README.md CLAUDE.md AGENTS.md WORKLOG.md .claude-session.json COLLABORATORS.md docs/CONTRACTS.md docs/ARCHITECTURE.md .env.example SECURITY.md LICENSE .nvmrc; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          python3 -m json.tool .claude-session.json > /dev/null
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - if: hashFiles('package-lock.json') != ''
        run: npm run build
      - if: hashFiles('package-lock.json') != ''
        run: npm run lint
      - if: hashFiles('package-lock.json') != ''
        run: npm test
